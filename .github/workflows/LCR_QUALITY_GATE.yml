name: Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run validate
      - name: LCR_START and nomenclature
        working-directory: .
        run: |
          python code/scripts/lcr_start.py --verify
          python code/scripts/lcr_naming.py --check
          python -m unittest discover -s code/tests -p 'test_lcr_*.py' -v
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AcademicWorkspaceEvidence
          path: code/test-results/
          if-no-files-found: warn
          retention-days: 14
      - run: node -e "const fs=require('fs'); const files=fs.readdirSync('dist/assets'); if(files.some(x=>/\\.(pdf|docx|xlsx|pptx|zip)$/i.test(x)))process.exit(1)"
