name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths: ['code/**', '.github/workflows/PAGES.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci && npm run build
        working-directory: code
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke HTTP
        run: curl --fail --retry 3 --retry-delay 2 --max-time 20 "${{ steps.deployment.outputs.page_url }}"
